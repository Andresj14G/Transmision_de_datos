<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b141a">
  <meta name="description" content="SoundBridge convierte tus mensajes en audios que puedes reproducir y compartir. Ábrelos en otro teléfono para leerlos, sin micrófono.">
  <title>SoundBridge</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230b141a'/%3E%3Cpath d='M8 34c4 0 4-12 8-12s4 22 8 22 4-28 8-28 4 34 8 34 4-26 8-26 4 14 8 14' fill='none' stroke='%232dd4bf' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-logo" aria-hidden="true">
          <svg viewBox="0 0 64 64" role="img" aria-label="Logotipo de SoundBridge">
            <rect width="64" height="64" rx="16" fill="#0f2b2f"></rect>
            <path d="M8 34c4 0 4-12 8-12s4 22 8 22 4-28 8-28 4 34 8 34 4-26 8-26 4 14 8 14"
                  fill="none" stroke="#2dd4bf" stroke-width="5" stroke-linecap="round"></path>
          </svg>
        </span>
        <div class="brand-text">
          <h1>SoundBridge</h1>
          <p>mensajes que suenan</p>
        </div>
      </div>
      <div class="topbar-actions">
        <button class="icon-btn mic-btn" id="btnMic" type="button" aria-pressed="false"
                aria-label="Activar micrófono (opcional)" title="Micrófono (opcional)">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 3.5a3 3 0 0 1 3 3v5a3 3 0 0 1-6 0v-5a3 3 0 0 1 3-3Z" fill="none" stroke="currentColor" stroke-width="1.8"></path>
            <path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3M9 21h6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
          </svg>
        </button>
      </div>
    </header>

    <section class="status-strip" aria-live="polite">
      <div class="status-main">
        <span class="status-dot" id="statusDot" aria-hidden="true"></span>
        <span class="status-text" id="statusText">Listo · escribe un mensaje</span>
      </div>
      <div class="status-side">
        <div class="level" id="micLevel" aria-hidden="true"><span class="level-fill" id="levelFill"></span></div>
        <span class="connection" id="connectionText">
          <span class="connection-dot" aria-hidden="true"></span><span id="connectionLabel">En línea</span>
        </span>
      </div>
    </section>

    <main class="chat" id="chat">
      <div class="empty-state" id="emptyState">
        <svg class="empty-wave" viewBox="0 0 120 48" aria-hidden="true">
          <path d="M4 26c6 0 6-14 12-14s6 26 12 26 6-34 12-34 6 42 12 42 6-32 12-32 6 18 12 18 6-10 12-10 6 6 12 6"
                fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"></path>
        </svg>
        <h2>Mensajes que suenan</h2>
        <p>Escribe y envía: tu texto se convierte en un audio.<br>
           Comparte el audio o ábrelo en otro teléfono para leerlo.</p>
        <p class="empty-hint">Con el clip puedes abrir un audio y transcribirlo, sin micrófono.</p>
      </div>
      <div class="messages" id="messages" role="log" aria-live="polite" aria-label="Mensajes"></div>
    </main>

    <form class="composer" id="composer" autocomplete="off">
      <button class="composer-btn clip-btn" id="btnClip" type="button" aria-label="Abrir un audio y transcribirlo" title="Abrir un audio y transcribirlo">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M8.5 12.5 13 8a3 3 0 0 1 4.3 4.3l-6.4 6.4a4.5 4.5 0 0 1-6.4-6.4l7-7"
                fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
        </svg>
      </button>
      <input type="file" id="fileInput" accept="audio/*,.wav,.mp3,.m4a,.ogg,.webm" hidden>
      <label class="sr-only" for="inputText">Mensaje</label>
      <textarea id="inputText" class="composer-input" rows="1" maxlength="600"
                placeholder="Escribe un mensaje…" enterkeyhint="send"></textarea>
      <button class="composer-btn send-btn" id="btnSend" type="submit" aria-label="Enviar mensaje" title="Enviar y generar audio (Enter)">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 11.5 20 4l-5 16-3.5-6.5L4 11.5Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"></path>
        </svg>
      </button>
    </form>

    <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
  </div>

  <script src="js/phy.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
